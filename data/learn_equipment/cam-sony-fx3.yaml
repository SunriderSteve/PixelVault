id: cam_sony_fx3
name: Sony FX3
brand: Sony
category: Camera

# cover images for the carousel
coverImages:
  - assets/images/sony_fx3_1.avif
  - assets/images/sony_fx3_1.avif

# high‑level description shown in an "About" section
description: |
  The Sony FX3 is a compact full‑frame cinema camera with excellent low‑light
  performance, active cooling, and a body tailored for handheld shooting.

# collapsible sections, each with images stacked vertically then body text
sections:
  - title: Setup Instructions
    images:
      - assets/images/equipment/sony_fx3/setup1.avif
      - assets/images/equipment/sony_fx3/setup2.avif
    body: |
      1. Insert a V90 SD card or CFexpress Type‑A.
      2. Mount a fully charged NP‑FZ100 battery.
      3. Set the camera to Cine EI mode.

  - title: How To Use
    images:
      - assets/images/sony_fx3_1.avif
      - assets/images/sony_fx3_1.avif
    body: |
      Use S‑Cinetone for quick turnaround work, or S‑Log3 for grading.
      Keep base ISO at 800/12,800 and expose to the right where possible.

# related equipment cards (by id)
related:
  - cam_sony_a7s3
  - cam_sony_fx30
