sections:
  - title: What this lens is
    images: []
    body: |
      This is a **telephoto zoom** lens, designed to bring far subjects closer. It covers 70mm to 200mm and has a maximum aperture of **f/2.8**. It often includes image stabilization (OSS), which helps reduce handheld shake.

  - title: What it is best used for
    images: []
    body: |
      This lens is ideal for **sports**, **stage performances**, **events**, and **portraits** with strong background blur. It is also useful for filming unobtrusively, because you can stay farther away and still get close-looking shots.

  - title: How to use it well
    images: []
    body: |
      Use shorter telephoto (70-100mm) for more flexible framing and longer telephoto (135-200mm) when you want strong isolation and cleaner backgrounds.

      For steadier handheld shots, keep your stance stable and consider using stabilization plus a monopod or tripod for long takes. Because the view is tighter, small camera shakes are more noticeable, so move gently and avoid quick reframes.

  - title: Common mistakes to avoid
    images: []
    body: |
      - Avoid panning too fast, because telephoto movement can look jerky and hard to follow.
      - Avoid filming long handheld takes at 200mm without support if possible, because fatigue will show in the footage.
      - Avoid forgetting your minimum focus distance; if you are too close, it may not focus.
