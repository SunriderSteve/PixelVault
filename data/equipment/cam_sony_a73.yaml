# high‑level description
description: |
  The Sony A7 III is a versatile full-frame hybrid camera. While excellent for photography, it is also a powerhouse for 4K video.

  This guide covers the essentials: handling power/media, mastering the exposure triangle for video, using the histogram, and connecting audio.

# collapsible sections
sections:
  - title: 1. Getting Started (Battery & Media)
    images:
      - assets/images/equipment/sony_a73/setup1.avif
    body: |
      **Battery (NP-FZ100):**
      • The battery door is on the bottom of the grip. Slide the switch to open.
      • Insert the battery with the contacts going in first.

      **Memory Cards (CRITICAL INFO):**
      • The media door is on the right side. Slide the cover back to open.
      • **Slot 1 (Bottom):** This is the **FAST** slot (UHS-II). Always put your main card here for 4K recording.
      • **Slot 2 (Top):** This is the **SLOW** slot (UHS-I). Use this for backups or photos.
      • **Formatting:** Go to **MENU > Setup (Yellow Toolbox) > Page 5 > Format**.

  - title: 2. The Exposure Triangle (Video Settings)
    images: []
    body: |
      To get a cinematic look, switch the **Mode Dial** on top to the **Film Strip** icon, then set the following:

      1. **Shutter Speed:**
         - Follow the "180° Rule" (Double your frame rate).
         - **24/25 fps:** Set shutter to **1/50**.
         - **50/60 fps:** Set shutter to **1/100** or **1/125**.
         - *Note:* Never change shutter speed to adjust brightness. Use ISO or Aperture.

      2. **Aperture (Iris):**
         - **Low f-number (e.g., f/2.8):** Blurry background (bokeh), lets in more light.
         - **High f-number (e.g., f/11):** Everything in focus, lets in less light.

      3. **ISO (Sensitivity):**
         - **Standard:** Keep as low as possible (100-640) for clean footage.
         - **S-Log3:** If shooting Log, your **Native ISO is 800**. Sticking to 800 gives the best dynamic range.

  - title: 3. Checking Exposure (The Histogram)
    images: []
    body: |
      The LCD screen brightness can be misleading. Always check the Histogram.

      • **How to find it:** Press the **DISP** (Display) button on the top of the rear control wheel repeatedly until the graph appears.
      • **The Rule:**
        - **Left Side:** Shadows/Blacks. If the graph hits the left wall, your blacks are "crushed" (too dark).
        - **Right Side:** Highlights/Whites. If the graph hits the right wall, your whites are "clipped" (too bright).
        - **Goal:** Keep the "mountain" of data near the center, or slightly to the right.

  - title: 4. Audio Setup
    images:
      - assets/images/equipment/sony_a73/setup2.avif
    body: |
      • **Microphone Input (Red):** Located behind the top flap on the left side. Connect your shotgun mic or wireless receiver here.
      • **Headphone Jack (Black):** Located directly below the mic jack. **ALWAYS** use headphones to check if audio is distorting or if there is wind noise.
      • **Levels:** You should see audio bars on the screen. Ideally, your audio should peak around **-12dB to -6dB**.

  - title: 5. Important Buttons
    images: []
    body: |
      • **REC Button:** Small red button near the viewfinder on the back right.
      • **C1 / C2 Buttons:** Located near the shutter. Usually customized for White Balance or Focus Area.
      • **AF-ON:** Back button, often used for engaging autofocus without taking a picture.

