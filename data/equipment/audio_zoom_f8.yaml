coverImages: []
description: |
  The Zoom F8 is a professional multi-track field recorder with 8 inputs and dual SD card slots. It offers high-quality preamps and timecode support, making it ideal for film and documentary sound.

  This guide covers the essentials: powering up, connecting mics, setting levels, and managing recording.

# collapsible sections
sections:
  - title: 1. Getting Started (Power & Media)
    images: []
    body: |
      **Batteries (8x AA):**
      • The battery compartment is on the rear. Loosen the screw to open the door.
      • Remove the battery sled, insert 8 AA batteries (pay attention to polarity), reinsert the sled, and lock the door.
      • *Alternative:* Use the provided 12V AC Adapter or an external DC battery via the 4-pin Hirose connector.

      **SD Cards (Dual Slots):**
      • Open the door on the left side of the unit.
      • Insert SD cards into Slot 1 and/or Slot 2 (contacts facing down).
      • **Formatting:** Press **MENU > SD CARD > Format** to prepare cards before use.

  - title: 2. Connecting Inputs
    images: []
    body: |
      **XLR/TRS Inputs:**
      • Connect microphones or line-level devices to Inputs 1-8 on the sides using XLR or 1/4" cables. 
      **Phantom Power (+48V):**
      • Required for shotgun mics and condensers.
      • Go to **MENU > INPUT > Phantom > On/Off**. Select the specific tracks requiring power (e.g., Input 1, Input 2).
      • *Warning:* Do not send Phantom Power to ribbon mics or line-level wireless receivers.

  - title: 3. Levels & Monitoring
    images: []
    body: |
      **Adjusting Input Gain (Trim):**
      • Use the numbered **Track Knobs (1-8)** on the front panel to adjust the gain for each microphone.
      • **Target:** Aim for levels to peak between **-12dB and -6dB** on the LCD screen.

      **Headphone Monitoring:**
      • Connect headphones to the 1/4" jack on the right side.
      • **Volume:** Use the small recessed knob next to the headphone jack to adjust monitoring volume.
      • **PFL (Pre-Fade Listen):** Press the **PFL button** above any track knob to "Solo" that channel and hear it clearly, ignoring others.

  - title: 4. Recording Controls
    images: []
    body: |
      **Arming Tracks:**
      • Press the numbered buttons **[1] - [8]** to arm tracks.
      • **Red LED:** Track is armed and will be recorded.
      • **No Light:** Track is muted/disarmed.

      **Transport:**
      • **REC (Red Circle):** Press to start recording. The LED ring glows red.
      • **STOP (Square):** Press to stop recording and save the file.
      • **PLAY:** Press to review the last take.

  - title: 5. Essential Field Features
    images: []
    body: |
      • **Slate Mic:** Push the toggle switch (above the Menu button) to the **Left** to activate the built-in mic. Use this to speak slate info (e.g., "Scene 1, Take 2") directly onto the tracks.
      • **Hold Switch:** Slide the Power switch to the **HOLD** position during recording to prevent accidental button presses.

