sections:
  - title: What this lens is
    images: []
    body: |
      This is an **ultra-wide zoom** lens. It can show a lot of the scene at once, from very wide (12mm) to wide (24mm). It has a maximum aperture of **f/4**, which is a steady brightness level across the zoom range.

  - title: What it is best used for
    images: []
    body: |
      This lens is best when the **space itself** matters. It is great for **architecture**, **interiors**, **wide establishing shots**, **tight rooms**, and **big locations** where you want the viewer to feel the size of the place.

      It can also work for creative shots where you want a strong sense of closeness to the subject while still showing the environment.

  - title: How to use it well
    images: []
    body: |
      Keep the camera level when filming buildings or rooms, because tilting up or down can make straight lines look like they are leaning. If people are near the edge of the frame, they can look stretched; try placing faces closer to the center when possible.

      Move the camera closer instead of zooming when you want the shot to feel more immersive, but do not get so close that people look distorted. Watch the background carefully, because wide lenses include a lot of extra objects that can distract.

  - title: Common mistakes to avoid
    images: []
    body: |
      - Avoid placing a person's face at the far left or far right edge, because it can look unnaturally stretched.
      - Avoid shooting in cluttered spaces without checking corners, because wide lenses easily capture distracting items.
      - Avoid strong tilts unless you want a stylized look, because it can make a room feel "falling over" by accident.
