sections:
  - title: What this lens is
    images: []
    body: |
      This is a **50mm prime** lens, meaning it does not zoom. 50mm is often called a "natural" view because it can feel similar to how scenes look in real life. It has a wide maximum aperture of **f/1.4**, which is great for low light and strong background blur.

  - title: What it is best used for
    images: []
    body: |
      This lens is great for **portraits**, **interviews**, **cinematic close-ups**, and **indoor filming** where you need more light. It is also useful when you want the subject to stand out clearly from the background.

  - title: How to use it well
    images: []
    body: |
      When using f/1.4, focus carefully on the eyes, because a small miss can make the whole face look slightly soft. If focus is struggling, stop down a little (for example, f/2 or f/2.8) to make focusing easier while still keeping good background separation.

      Use this lens when you can control your distance, because you cannot zoom to fix framing without moving.

  - title: Common mistakes to avoid
    images: []
    body: |
      - Avoid using f/1.4 in fast-moving scenes unless you are confident in your focus, because the sharp focus zone can be very thin.
      - Avoid standing too close for face shots, because it can exaggerate facial features; take a small step back if the face looks too "pushed forward."
      - Avoid forgetting that you cannot zoom; plan where you can stand before you start rolling.
