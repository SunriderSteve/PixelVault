id: histogram
name: Histogram
coverImages: []
description: |
  A **histogram** is a simple graph that shows how bright or dark your image is.
  Instead of trusting just your eyes or the camera screen (which can be misleading),
  you can use the histogram to see whether your shot is too dark, too bright, or nicely balanced.

  The histogram does not show you what the picture *looks* like. Instead, it shows how the
  brightness values are spread from pure black to pure white. Once you know how to read it,
  you can use it to avoid crushed shadows and blown-out highlights, and to keep your exposure
  consistent between shots.

sections:
  - title: What a histogram shows
    images: []
    body: |
      A histogram is a **graph of brightness**:

      • The **left side** of the graph represents the *dark* parts of the image (shadows).  
      • The **middle** represents *midtones* (most skin tones and normal objects).  
      • The **right side** represents the *bright* parts (highlights).

      The **height of the graph** at any point shows how many pixels are at that brightness:

      • A tall spike means “a lot of pixels at this brightness.”  
      • A low shape means “only a few pixels at this brightness.”

      The histogram is not “good” or “bad” by itself. It depends on the scene. A dark scene
      will naturally have more information on the left; a bright scene will have more on the right.
      The important thing is to avoid losing detail at the extreme ends unless you truly want that look.

  - title: Reading the histogram for exposure
    images: []
    body: |
      *Normal, balanced exposure (for many scenes):*
      • The graph is **mostly in the middle**, with a gentle spread to both sides.  
      • There are **no big spikes crushed against the far left or far right**.  
      • This often means you are keeping detail in both shadows and highlights.

      *Underexposed (too dark):*
      • The graph is pushed **towards the left side**.  
      • You may see a spike touching the far left edge.  
      • This means many dark areas are so close to black that you may lose detail.

      *Overexposed (too bright):*
      • The graph is pushed **towards the right side**.  
      • You may see a spike touching the far right edge.  
      • This means some bright areas are so close to pure white that you may lose detail.

      When you see the graph **piling up at either end**, it usually means that part of the image
      has no detail left. You cannot fully recover that information later in editing.

  - title: Understanding clipping (lost detail)
    images: []
    body: |
      **Clipping** happens when part of the image is too dark or too bright for the camera to record
      detail. On the histogram, clipping shows up as the graph pressing hard against the left or right edge.

      *Shadow clipping (left side):*
      • A lot of data squashed on the far left means parts of the image are pure black.  
      • In those areas, you may lose texture and detail (for example, dark hair, black clothing,
        or shadowy corners).

      *Highlight clipping (right side):*
      • A lot of data squashed on the far right means parts of the image are pure white.  
      • You may lose detail in bright areas, such as clouds, white shirts, or shiny objects.

      In many real scenes, a small amount of clipping is normal. For example, very bright lights or
      very deep shadows may clip and that is acceptable. The goal is to avoid **unwanted** clipping
      on important parts of the image, such as faces and key details.

  - title: How to use the histogram while shooting
    images: []
    body: |
      *Step 1 - Turn on the histogram display on your camera or monitor (if available).*
      • Many cameras can show a live histogram while you frame your shot.  
      • Some may only show it when reviewing a clip or still image.

      *Step 2 - Frame your shot normally.*
      • Set up your composition and focus first.  
      • Then look at the histogram alongside the image.

      *Step 3 - Adjust exposure based on what the histogram shows.*
      • If most of the graph is **crushed to the left**, try to **brighten** the image:  
        - Open the aperture (lower f-number), or  
        - Slow down the shutter speed (if motion blur is acceptable), or  
        - Raise the ISO (accepting some noise).  

      • If most of the graph is **crushed to the right**, try to **darken** the image:  
        - Close the aperture (higher f-number), or  
        - Use a faster shutter speed, or  
        - Lower the ISO.

      Your goal is usually to keep the histogram **away from both edges** for important areas
      of the image, unless you intentionally want very deep blacks or very bright highlights.

  - title: Special cases - high contrast and low contrast scenes
    images: []
    body: |
      *High contrast scenes (very bright and very dark areas together):*
      • Example: a person standing in front of a bright window.  
      • The histogram may show **data spread widely across the whole graph**.  
      • It is sometimes impossible to keep detail in both the brightest and darkest areas.  
      • In these cases, decide what matters more (usually the **person’s face**) and protect that
        part from clipping, even if other areas clip.

      *Low contrast scenes (mostly midtones):*
      • Example: a cloudy day with soft, even light.  
      • The histogram may form a **gentle hump in the middle**, with little at the extremes.  
      • This is usually easy to expose. Just make sure it does not accidentally lean too far
        left (too dark) or too far right (too bright).

      Remember: the histogram is a **tool**, not a strict rule. Use it together with your eyes,
      your monitor, and other aids (like zebras) to judge exposure more accurately.
