id: shot_sizes_angles
name: Shot Sizes & Angles
coverImages: []
description: |
  **Shot sizes** and **shot angles** help you decide how much of the subject to show and from which
  position you film them. Together, they change how the audience *feels* about the scene.

  **Shot size** is “how close” or “how far” the camera appears to be. It controls how much
  of the subject and background we see.

  **Shot angle** is “from where” we see the subject: eye level, from above, from below,
  from behind, and so on.

  Once you understand the common shot sizes and angles, you can plan your shots
  to guide the viewer's attention and emotions on purpose, instead of just guessing.

sections:
  - title: What shot size and angle do
    images: []
    body: |
      *Shot size:*
      • Decides how much of the subject's body is in the frame (head only, waist up, full body, etc.).  
      • Controls how close the audience feels to the subject (intimate vs. distant).  
      • Affects how much of the environment is visible.

      *Shot angle:*
      • Decides from which height and side you are filming (straight on, from above, below, behind).  
      • Affects how powerful, weak, equal, or mysterious a subject feels.  
      • Helps support the emotion of the scene without any dialogue.

      You usually choose **shot size first** (how much you want to show), then choose the **angle**
      that best fits the mood and message of the shot.

  - title: Common shot sizes
    images: []
    body: |
      Here are common shot sizes, from widest to closest:

      *1) Extreme wide shot (EWS)*
      • Shows a very large view of the scene, such as a landscape or a big room.  
      • The subject may be very small or not clearly visible.  
      • Use it to show *where* the scene is happening and give a sense of scale.

      *2) Wide shot (WS) or long shot*
      • Shows the full body of the subject from head to toe, with a lot of background.  
      • Good for showing movement, such as a person walking in a space.  
      • Use it when the environment is important to the story.

      *3) Medium wide shot (MWS)*
      • Shows the subject from around the knees up.  
      • Keeps some environment, but brings the viewer closer to the subject.  
      • Useful for group shots or when you want to see body language.

      *4) Medium shot (MS)*
      • Shows the subject from around the waist up.  
      • A common shot for conversations.  
      • Balances facial expressions with some body movement.

      *5) Medium close-up (MCU)*
      • Shows the subject from around the chest or shoulders up.  
      • Focuses more on the face while still giving a little sense of the body.  
      • Great for interviews and most dialogue scenes.

      *6) Close-up (CU)*
      • Shows only the head or a specific part of the subject (for example, just the face).  
      • Highlights emotion, details, and reactions.  
      • Use it to draw strong attention to what the subject is feeling.

      *7) Extreme close-up (ECU)*
      • Shows a very small part of the subject, such as eyes, hands, or an object.  
      • Removes almost all background information.  
      • Use it to highlight important details or create tension and focus.

  - title: When to choose each shot size
    images: []
    body: |
      *Use wider shots (EWS, WS) when:*
      • You want to show **where** the scene takes place.  
      • Movement and environment matter a lot (for example, action scenes or crowd scenes).  
      • You are starting a scene and want the viewer to understand the location.

      *Use medium shots (MWS, MS) when:*
      • You want a balance of body language and facial expression.  
      • Characters are talking and you want to see how they react to each other.  
      • You need a “normal” view that feels natural and comfortable.

      *Use closer shots (MCU, CU, ECU) when:*
      • You want the viewer to feel more connected to the character's **emotions**.  
      • You are showing important details (a key, a phone screen, facial reactions).  
      • You want to increase tension or make a moment feel more intense.

      A simple way to think about it:  
      • **Wide** for *“where”*.  
      • **Medium** for *“what is happening”*.  
      • **Close** for *“how it feels”*.

  - title: Common shot angles
    images: []
    body: |
      Shot angle changes the **feeling** of the shot even when the size stays the same.

      *1) Eye-level angle*
      • The camera is at the same height as the subject's eyes.  
      • Feels natural and neutral, like how we see people in real life.  
      • Good default angle for most dialogue and interviews.

      *2) High angle*
      • The camera looks down at the subject from above.  
      • Can make the subject look smaller, weaker, or more vulnerable.  
      • Use it when a character is in trouble, alone, or overwhelmed.

      *3) Low angle*
      • The camera looks up at the subject from below.  
      • Can make the subject look powerful, confident, or threatening.  
      • Use it to show strength, authority, or importance.

      *4) Over-the-shoulder shot (OTS)*
      • The camera is behind one person, looking at another person or an object.  
      • You see the back of the first person's head and shoulder in the frame.  
      • Common in conversations to show the point of view of one character while still
        including the other.

      *5) Point-of-view shot (POV)*
      • Shows what a character would see through their own eyes.  
      • The camera replaces the character's eyes.  
      • Use it to make the audience feel like they are in the character's position.

      *6) Top-down shot (bird's-eye view)*
      • The camera is directly above the subject, looking straight down.  
      • Makes the scene feel more abstract, distant, or carefully arranged.  
      • Useful for showing patterns, maps, or complex blocking (where everyone stands).

  - title: Combining size and angle for storytelling
    images: []
    body: |
      You can mix different sizes and angles in the same scene to guide emotions:

      *Example 1 – Showing power change in a conversation*
      • Start with both characters at eye level in medium shots.  
      • When one character gains control, move to a slightly **low angle** on that character.  
      • You can also use a slightly **high angle** on the weaker character.

      *Example 2 – Building emotion*
      • Start a scene with a **wide shot** to show where we are.  
      • Move to **medium shots** as the conversation grows more personal.  
      • End with **close-ups** when the emotions peak or a secret is revealed.

      *Example 3 – Following a character*
      • Use a medium or wide shot from behind as they walk into a new place.  
      • Switch to an **over-the-shoulder** shot when they talk to someone.  
      • Use a **close-up** when they react to surprising news.

      By planning your shot sizes and angles in advance, you can create smoother edits and
      more engaging videos that feel intentional rather than random.
