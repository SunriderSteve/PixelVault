id: shot_sizes
name: Shot Sizes
covers: []
description: |
  Shot size describes how much of the subject and environment fills the frame. Consistent naming helps planning, communication, and editing.

sections:
  - title: Core Sizes (People as Reference)
    images: []
    body: |
      • ECU — Extreme Close-Up: detail (eyes, hands).
      • CU — Close-Up: head fills frame; strong emotion.
      • MCU — Medium Close-Up: head to mid-torso; interviews.
      • MS — Medium Shot: waist-up; balanced context + performance.
      • MLS/MWS — Medium Long/Wide: knees-up or similar.
      • FS — Full Shot: head-to-toe.
      • WS/LS — (Wide/Long): full figure with environment.
      • EWS/ELS — Extreme Wide/Long: environment-dominant; establishing.

  - title: Framing Variations
    images: []
    body: |
      • OTS — Over-the-Shoulder: dialogue coverage.
      • POV — Point of View: character perspective.
      • Insert/Cutaway — detail/context for continuity.

  - title: Practical Usage
    images: []
    body: |
      • Coverage: get matching CUs/MCUs both sides; add cutaways.
      • Scene openers: EWS/WS to orient; move into tighter sizes for emotion.
      • Continuity: keep screen direction and eye-line consistent.
