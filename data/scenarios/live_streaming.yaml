id: live_streaming
name: Live Streaming
coverImages:
  - assets/images/scenarios/live_streaming.avif
description: |
  A live workflow requires stable signal flow, reliable audio mixing, network resilience, and clear roles. Plan redundancy and test thoroughly before going live.

sections:
  - title: Signal Flow Overview
    images: []
    body: |
      • Cameras → switcher → program out → encoder → platform (RTMP/SRT).
      • Record ISO or program as backup; keep a slate to sync with on-camera audio.

  - title: Audio Routing & Mix
    images: []
    body: |
      • Mix mics and playback to a dedicated bus feeding the encoder/switcher.
      • Use limiters and conservative levels (-18 to -16 LUFS integrated); monitor latency.

  - title: Graphics & Monitoring
    images: []
    body: |
      • Prepare lower thirds/bugs/titles; check safe areas.
      • Monitor program, confidence, and platform return feeds; verify sync (lips vs. audio).

  - title: Networking & Redundancy
    images: []
    body: |
      • Prefer wired Ethernet; avoid congested Wi-Fi bands.
      • Bond or failover to secondary internet (hotspot/5G router) if possible.
      • Keep a second encoder/stream profile ready to switch.

  - title: Preflight Checklist
    images: []
    body: |
      • Test all sources (cameras, screen capture, playback). Verify audio on every mic.
      • Confirm stream key and platform ingest server; run a private test stream.
      • Battery/AC checks, media space, timecode/scene naming consistent.

  - title: Troubleshooting
    images: []
    body: |
      • Dropped frames: lower bitrate/resolution; prioritize encoder hardware; check CPU/GPU load.
      • Audio drift: lock sample rates; avoid sample-rate mismatches between devices.
      • Network instability: switch to backup path; reduce encoder bitrate and GOP size.

