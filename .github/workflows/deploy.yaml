# .github/workflows/deploy.yml
name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read # default, needed to checkout code
  pages: write # needed to upload/publish Pages
  id-token: write # needed to mint the OIDC token for deploy-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - uses: actions/checkout@v5

      # 2. Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter --version

      # 3. Build the web app
      - run: flutter pub get
      - run: flutter build web --release --base-href /PixelVault/

      # 4. Configure GitHub Pages
      - uses: actions/configure-pages@v6

      # 5. Upload the build output
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/web

      # 6. Deploy to GitHub Pages
      - uses: actions/deploy-pages@v5
